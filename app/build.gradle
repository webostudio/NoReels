plugins {
    id 'com.android.application'
}

android {
    namespace 'sk.noreels'
    compileSdk 35

    defaultConfig {
        applicationId 'sk.noreels'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            // podpisuje sa debug kľúčom, aby sa APK dalo hneď nainštalovať
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
